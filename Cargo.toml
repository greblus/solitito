[package]
name = "solitito"
version = "0.5.6"
edition = "2021"

[dependencies]
cpal = "0.15"
rustfft = "6.2"
anyhow = "1.0"
log = "0.4"
ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "download-binaries"] }
ndarray = "0.15"
slint = "1.18.1" 
hound = "3.5"
keepawake = "0.4"
# Not called from here. zune-jpeg reaches us through Slint's image support and
# calls warn!(..) in expression position, which is only a real macro when
# zune-core's `log` feature is on; 0.5.3 is the first version that makes it so.
# Naming it as a direct dependency is what pins that version - without this the
# build fails inside a crate we never asked for. It replaced a vendored copy of
# zune-jpeg that differed from the published one by a semicolon.
zune-core = "0.5.3"

# Nowe zależności do wczytywania dsp_weights.json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"


[build-dependencies]
slint-build = "1.18.1"
